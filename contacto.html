<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-4.0.0-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>VehiPlaza - Contacto</title>
</head>

<body class="bg-light">
    <header class="container-fluid bg-light py-3 border-bottom mb-4">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <img src="img/logo.png" alt="logo" id="logo">
                    <h1 class="h4 mb-0">VehiPlaza</h1>
                </div>
                <nav class="main-menu">
                    <ul class="nav">
                        <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
                        <li class="nav-item"><a href="contacto.html" class="nav-link">Contacto</a></li>
                        <li class="nav-item" id="nav-publicar"><a href="publicar.html"
                                class="nav-link active">Publicar</a></li>
                        <li class="nav-item" id="nav-login" style="display: none;"><a href="inisesi.html"
                                class="nav-link">Iniciar sesión</a></li>
                        <li class="nav-item" id="nav-registro" style="display: none;"><a href="registro.html"
                                class="nav-link">Registrarse</a></li>
                        <li class="nav-item" id="nav-logout"><a href="#" class="nav-link text-danger"
                                id="btn-cerrar-sesion">Cerrar sesión</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-4 text-center h4">Envianos tus sugerencias</h2>
                    <form action="">
                        <div class="form-group">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre">
                        </div>
                        <div class="form-group">
                            <label for="correo" class="form-label">Correo Electronico</label>
                            <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="form-group">
                            <label for="asunto" class="form-label">Asunto</label>
                            <input type="text" class="form-control" id="asunto"
                                placeholder="¿De qué trata tu sugerencia?">
                        </div>
                        <div class="form-group">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4"
                                placeholder="Escribe tu mensaje aquí."></textarea>
                        </div>
                        <div class="text-end mt-4 text-right">
                            <button type="submit" class="btn btn-primary px-4">Enviar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="js/nav.js"></script>
    <script src="js/contacto.js"></script>
</body>

</html>
